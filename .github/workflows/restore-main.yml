name: Restore main.py

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    if: startsWith(github.event.head_commit.message, 'refactor: route Melimi responses through generation finalizer')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore main.py from last known-good commit
        run: |
          git checkout 40e421e8c8e61a5b3b0ee12bf6448539342fee8a -- app/main.py
          rm -f .github/workflows/restore-main.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/main.py .github/workflows/restore-main.yml
          git commit -m "fix: restore complete application entrypoint"
          git push
