name: ChatGPT CI Helper

on:
  workflow_run:
    workflows:
      - TeluAI CI
    types:
      - completed

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  analyze_ci_failure:
    name: Analyze failed CI with ChatGPT
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Collect failed CI logs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          gh run view "$RUN_ID" --repo "$REPO" --log > ci.log
          if [ "$(wc -c < ci.log)" -gt 120000 ]; then
            tail -c 120000 ci.log > ci-trimmed.log
            mv ci-trimmed.log ci.log
          fi
          echo "Collected $(wc -c < ci.log) bytes from failed run $RUN_ID."

      - name: Find pull request
        id: pr
        env:
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Diagnose failure
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          with open("ci.log", "r", encoding="utf-8", errors="replace") as handle:
              logs = handle.read()

          api_key = os.environ.get("OPENAI_API_KEY", "").strip()

          if not api_key:
              diagnosis = """## Root cause

          The failed TeluAI CI run was collected, but OPENAI_API_KEY is not configured.

          ## Evidence

          The ChatGPT CI Helper can collect the GitHub Actions logs, but it cannot call the OpenAI API without the repository secret.

          ## Recommended fix

          Configure the OPENAI_API_KEY repository secret if automated OpenAI diagnosis is wanted.

          ## Regression risk

          None to TeluAI. This helper does not modify application code.
          """
              with open("diagnosis.md", "w", encoding="utf-8") as handle:
                  handle.write(diagnosis)
              raise SystemExit(0)

          prompt = (
              "You are the CI debugging assistant for the TeluAI repository.\n\n"
              "Analyze the failed GitHub Actions run below.\n"
              "Identify the first/root failure, affected file/module/test, why it fails, "
              "the smallest safe fix, and regression risk. Preserve TeluAI's existing "
              "architecture and deterministic Melimi language authority.\n\n"
              "Return exactly these headings:\n"
              "## Root cause\n## Evidence\n## Recommended fix\n## Regression risk\n\n"
              "FAILED CI LOG:\n" + logs
          )

          payload = {
              "model": os.environ.get("OPENAI_MODEL") or "gpt-4.1-mini",
              "input": prompt,
              "max_output_tokens": 1800,
          }

          request = urllib.request.Request(
              "https://api.openai.com/v1/responses",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": "Bearer " + api_key,
                  "Content-Type": "application/json",
              },
              method="POST",
          )

          try:
              with urllib.request.urlopen(request, timeout=90) as response:
                  data = json.load(response)
          except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError) as exc:
              diagnosis = (
                  "## Root cause\n\n"
                  "The automated OpenAI diagnosis request failed.\n\n"
                  "## Evidence\n\n"
                  f"OpenAI API request failed with {type(exc).__name__}.\n\n"
                  "## Recommended fix\n\n"
                  "Inspect the failed TeluAI CI run directly and verify the OpenAI API credential/service.\n\n"
                  "## Regression risk\n\n"
                  "None to TeluAI. This helper does not modify application code.\n"
              )
              with open("diagnosis.md", "w", encoding="utf-8") as handle:
                  handle.write(diagnosis)
              raise SystemExit(0)

          text = data.get("output_text", "").strip()
          if not text:
              parts = []
              for item in data.get("output", []):
                  for content in item.get("content", []):
                      if content.get("type") == "output_text":
                          parts.append(content.get("text", ""))
              text = "\n".join(parts).strip()

          if not text:
              raise RuntimeError("OpenAI returned no diagnosis text")

          with open("diagnosis.md", "w", encoding="utf-8") as handle:
              handle.write(text)
          PY

      - name: Comment diagnosis on pull request
        if: ${{ steps.pr.outputs.number != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          {
            echo "## 🤖 TeluAI CI Failure Analysis"
            echo
            echo "Failed workflow run: [#$RUN_ID](https://github.com/$REPO/actions/runs/$RUN_ID)"
            echo
            cat diagnosis.md
            echo
            echo "---"
            echo "Automated diagnosis only. No source code was changed by this workflow."
          } > comment.md
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file comment.md
