name: ChatGPT CI Helper

on:
  workflow_run:
    workflows: ["TeluAI CI"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  analyze_ci_failure:
    name: Analyze failed CI with ChatGPT
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Collect failed CI logs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          gh run view "$RUN_ID" --repo "$REPO" --log > ci.log
          if [ "$(wc -c < ci.log)" -gt 120000 ]; then
            tail -c 120000 ci.log > ci-trimmed.log
            mv ci-trimmed.log ci.log
          fi
          echo "Collected $(wc -c < ci.log) bytes from failed run $RUN_ID."

      - name: Find pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          PR_NUMBER="$(gh run view "$RUN_ID" --repo "$REPO" --json pullRequests --jq '.pullRequests[0].number // empty')"
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          if [ -z "$PR_NUMBER" ]; then
            echo "No pull request is associated with this failed workflow run."
          else
            echo "Found PR #$PR_NUMBER."
          fi

      - name: Ask OpenAI for failure diagnosis
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request

          with open("ci.log", "r", encoding="utf-8", errors="replace") as f:
              logs = f.read()

          prompt = f"""You are the CI debugging assistant for the TeluAI repository.

Analyze the failed GitHub Actions run below.

Your job is to:
1. Identify the first/root failure rather than merely repeating downstream failures.
2. Identify the affected file/module/test when possible.
3. Explain why the current implementation fails.
4. Give the smallest safe code change needed to fix it.
5. Mention regression risk.
6. Do not claim that a fix was applied; this workflow only reports the diagnosis.
7. Preserve TeluAI's existing architecture and deterministic Melimi language authority.

Return concise Markdown with these headings:
## Root cause
## Evidence
## Recommended fix
## Regression risk

FAILED CI LOG:
{logs}
"""

          payload = {
              "model": os.environ.get("OPENAI_MODEL") or "gpt-4.1-mini",
              "input": prompt,
              "max_output_tokens": 1800,
          }
          request = urllib.request.Request(
              "https://api.openai.com/v1/responses",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": "Bearer " + os.environ["OPENAI_API_KEY"],
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=90) as response:
              data = json.load(response)

          text = data.get("output_text", "").strip()
          if not text:
              parts = []
              for item in data.get("output", []):
                  for content in item.get("content", []):
                      if content.get("type") == "output_text":
                          parts.append(content.get("text", ""))
              text = "\n".join(parts).strip()
          if not text:
              raise RuntimeError("OpenAI returned no diagnosis text")

          with open("diagnosis.md", "w", encoding="utf-8") as f:
              f.write(text)
          PY

      - name: Comment diagnosis on pull request
        if: ${{ steps.pr.outputs.number != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          {
            echo "## 🤖 TeluAI CI Failure Analysis"
            echo
            echo "Failed workflow run: [#$RUN_ID](https://github.com/$REPO/actions/runs/$RUN_ID)"
            echo
            cat diagnosis.md
            echo
            echo "---"
            echo "This is an automated diagnosis from the ChatGPT CI Helper. No code was changed or merged by this workflow."
          } > comment.md
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file comment.md
