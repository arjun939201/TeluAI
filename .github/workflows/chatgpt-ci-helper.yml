name: ChatGPT CI Helper

on:
  workflow_run:
    workflows: ["TeluAI CI"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  analyze_ci_failure:
    name: Analyze failed CI with ChatGPT
    # This helper must never turn a healthy TeluAI CI result red.
    continue-on-error: true
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Collect failed CI logs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          gh run view "$RUN_ID" --repo "$REPO" --log > ci.log
          if [ "$(wc -c < ci.log)" -gt 120000 ]; then
            tail -c 120000 ci.log > ci-trimmed.log
            mv ci-trimmed.log ci.log
          fi
          echo "Collected $(wc -c < ci.log) bytes from failed run $RUN_ID."

      - name: Find pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          PR_NUMBER="$(gh run view "$RUN_ID" --repo "$REPO" --json pullRequests --jq '.pullRequests[0].number // empty')"
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          if [ -z "$PR_NUMBER" ]; then
            echo "No pull request is associated with this failed workflow run."
          else
            echo "Found PR #$PR_NUMBER."
          fi

      - name: Diagnose failure
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          with open("ci.log", "r", encoding="utf-8", errors="replace") as f:
              logs = f.read()

          prompt = f"""You are the CI debugging assistant for the TeluAI repository.

Analyze the failed GitHub Actions run below.

Identify the first/root failure, affected file/module/test, why it fails, the smallest safe fix, and regression risk. Preserve TeluAI's existing architecture and deterministic Melimi language authority.

Return concise Markdown with exactly these headings:
## Root cause
## Evidence
## Recommended fix
## Regression risk

FAILED CI LOG:
{logs}
"""

          api_key = os.environ.get("OPENAI_API_KEY", "").strip()
          if not api_key:
              with open("diagnosis.md", "w", encoding="utf-8") as f:
                  f.write("""## Root cause

The failed CI run was collected, but `OPENAI_API_KEY` is not configured for the ChatGPT CI Helper.

## Evidence

The helper can read the failed run using the GitHub Actions token, but no OpenAI API credential is available.

## Recommended fix

Configure the repository secret `OPENAI_API_KEY`. Optionally configure `OPENAI_MODEL`.

## Regression risk

None to the application; this workflow only reports CI failures.
""")
              exit(0)

          payload = {
              "model": os.environ.get("OPENAI_MODEL") or "gpt-4.1-mini",
              "input": prompt,
              "max_output_tokens": 1800,
          }
          request = urllib.request.Request(
              "https://api.openai.com/v1/responses",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": "Bearer " + api_key,
                  "Content-Type": "application/json",
              },
              method="POST",
          )

          try:
              with urllib.request.urlopen(request, timeout=90) as response:
                  data = json.load(response)
          except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError) as exc:
              with open("diagnosis.md", "w", encoding="utf-8") as f:
                  f.write(f"""## Root cause

The CI failure diagnosis service could not be reached.

## Evidence

OpenAI API request failed: `{type(exc).__name__}`.

## Recommended fix

Inspect the failed TeluAI CI run directly and restore the OpenAI API credential/service before relying on automated diagnosis.

## Regression risk

None to the application; this workflow does not modify source code.
""")
              exit(0)

          text = data.get("output_text", "").strip()
          if not text:
              parts = []
              for item in data.get("output", []):
                  for content in item.get("content", []):
                      if content.get("type") == "output_text":
                          parts.append(content.get("text", ""))
              text = "\n".join(parts).strip()
          if not text:
              raise RuntimeError("OpenAI returned no diagnosis text")

          with open("diagnosis.md", "w", encoding="utf-8") as f:
              f.write(text)
          PY

      - name: Comment diagnosis on pull request
        if: ${{ steps.pr.outputs.number != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          {
            echo "## 🤖 TeluAI CI Failure Analysis"
            echo
            echo "Failed workflow run: [#$RUN_ID](https://github.com/$REPO/actions/runs/$RUN_ID)"
            echo
            cat diagnosis.md
            echo
            echo "---"
            echo "This is an automated diagnosis from the ChatGPT CI Helper. No code was changed or merged by this workflow."
          } > comment.md
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file comment.md
