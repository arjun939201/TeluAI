name: Integrate Melimi Finalizer

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    if: startsWith(github.event.head_commit.message, 'fix: restore complete application entrypoint')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrate finalizer
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/main.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('from app.melimi.engine import build_language_engine_context\nfrom app.melimi.firewall import deterministic_repair\n', 'from app.melimi.engine import build_language_engine_context\nfrom app.melimi.generation import finalize_response\n')
          old = '    reply = clean_response(result["answer"])\n    if request.mode == "melimi": reply = deterministic_repair(reply)\n'
          new = '    reply = clean_response(result["answer"])\n    if request.mode == "melimi": reply = finalize_response(reply)["text"]\n'
          if old not in s:
              raise SystemExit('Expected chat finalization block was not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          rm -f .github/workflows/integrate-melimi-finalizer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/main.py .github/workflows/integrate-melimi-finalizer.yml
          git commit -m "feat: route Melimi chat through language finalizer"
          git push
