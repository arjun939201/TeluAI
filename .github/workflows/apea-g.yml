name: APEA-G Autonomous Engineering Agent

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Agent mode
        required: true
        default: continuous
        type: choice
        options: [continuous, audit, diagnose, repair]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: apea-g-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engineer:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 20

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Run APEA-G controller
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || secrets.GROQ_TOKEN || secrets.GROKTOKEN }}
          GROQ_TOKEN: ${{ secrets.GROQ_TOKEN || secrets.GROQ_API_KEY || secrets.GROKTOKEN }}
          GROKTOKEN: ${{ secrets.GROKTOKEN || secrets.GROQ_TOKEN || secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.APEA_G_MODEL || 'openai/gpt-oss-120b' }}
          GROQ_URL: ${{ vars.GROQ_URL || 'https://api.groq.com/openai/v1/chat/completions' }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          APEA_MODE: ${{ github.event.inputs.mode || 'continuous' }}
        run: python -m scripts.apea_g_runner
