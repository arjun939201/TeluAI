name: APEA-G Autonomous Engineering Agent

on:
  workflow_run:
    workflows: ["TeluAI CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        description: Agent mode
        required: true
        default: audit
        type: choice
        options: [audit, diagnose, repair]

permissions:
  contents: write
  issues: write
  actions: read

concurrency:
  group: apea-g-${{ github.event.workflow_run.id || github.ref }}
  cancel-in-progress: true

jobs:
  engineer:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          fetch-depth: 20

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Run APEA-G
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.APEA_G_MODEL || 'openai/gpt-oss-120b' }}
          GROQ_URL: ${{ vars.GROQ_URL || 'https://api.groq.com/openai/v1/chat/completions' }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          APEA_MODE: ${{ github.event.inputs.mode || 'diagnose' }}
          APEA_AUTOFIX: ${{ vars.APEA_G_AUTOFIX || 'false' }}
          APEA_BRANCH: apea-g/ci-repair-${{ github.run_id }}
        run: python scripts/apea_g.py
