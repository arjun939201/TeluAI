name: ChatGPT Code Review / Response

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  chatgpt:
    runs-on: ubuntu-latest
    if: startsWith(github.event.comment.body, '/chatgpt')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run ChatGPT Action
        uses: kxxt/chatgpt-action@main
        with:
          api_key: ${{ secrets.OPENAI_API_KEY }}
          split: 'true'
          # Optional custom settings:
          # model: 'gpt-4o'
          # temperature: 0.7
