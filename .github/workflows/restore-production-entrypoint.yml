name: Restore production entrypoint

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Restore known-good application entrypoint
        run: |
          git checkout 40e421e8c8e61a5b3b0ee12bf6448539342fee8a -- app/main.py

      - name: Commit restored entrypoint
        run: |
          if git diff --quiet -- app/main.py; then
            echo "app/main.py already matches the known-good entrypoint."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/main.py
          git commit -m "fix: restore complete production entrypoint"
          git push origin HEAD:main
