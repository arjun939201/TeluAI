name: TeluAI CI

on:
  push:
    branches:
      - main
      - 'apea-g/continuous-*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: teluai-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify dependency consistency
        run: pip check
      - name: Compile Python
        run: python -m compileall -q app tests
      - name: Check frontend JavaScript syntax
        run: |
          for file in static/js/*.js; do node --check "$file"; done
          node --check static/teluai2.js
      - name: Verify production ASGI composition
        env:
          PYTHONPATH: .
          CACHE_ENABLED: "false"
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -c "from app.server import app; print(app.title); assert app.title.startswith('TeluAI')"
      - name: Clean generated Python caches
        run: |
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' -o -name '*.pyd' \) -delete
      - name: Check repository hygiene
        run: |
          if git ls-files | grep -E '(^|/)(__pycache__/|.*\.py[cod]$)'; then
            echo "Tracked Python cache artifacts found."
            exit 1
          fi
      - name: Run complete test suite
        env:
          PYTHONPATH: .:scripts
          CACHE_ENABLED: "false"
          PYTHONDONTWRITEBYTECODE: "1"
          TELUAI_TESTING: "true"
        run: pytest -vv --timeout=60 --timeout-method=thread --import-mode=importlib
      - name: Run offline language evaluation
        env:
          PYTHONPATH: .:scripts
          PYTHONDONTWRITEBYTECODE: "1"
          TELUAI_TESTING: "true"
        run: python -m app.eval
