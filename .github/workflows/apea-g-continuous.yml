name: APEA-G Continuous Engineering

on:
  push:
    paths:
      - '.apea/apea-g-session.trigger'
  workflow_dispatch:
    inputs:
      approve_plan:
        description: Approve the persisted complete plan once and run it continuously
        required: false
        default: false
        type: boolean
      max_steps:
        description: Maximum steps per capability
        required: false
        default: "12"
        type: string
      max_repairs:
        description: Maximum CI repair attempts per step
        required: false
        default: "4"
        type: string
      merge:
        description: Merge the autonomous PR when every planned step is green
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write
  pull-requests: write
  issues: write

concurrency:
  group: apea-g-continuous-${{ github.ref_name }}
  cancel-in-progress: false

env:
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || secrets.GROQ_TOKEN }}
  GROQ_TOKEN: ${{ secrets.GROQ_TOKEN || secrets.GROQ_API_KEY }}
  GROQ_MODEL: ${{ vars.APEA_G_MODEL || 'openai/gpt-oss-120b' }}
  GROQ_URL: ${{ vars.GROQ_URL || 'https://api.groq.com/openai/v1/chat/completions' }}
  GITHUB_TOKEN: ${{ github.token }}
  APEA_GITHUB_TOKEN: ${{ secrets.APEA_GITHUB_TOKEN }}
  GITHUB_REPOSITORY: ${{ github.repository }}
  APEA_MAX_STEPS: ${{ inputs.max_steps || '12' }}
  APEA_MAX_REPAIRS: ${{ inputs.max_repairs || '4' }}
  APEA_MERGE: ${{ inputs.merge || 'false' }}
  APEA_PLAN_APPROVED: ${{ inputs.approve_plan || 'false' }}
  PYTHONUNBUFFERED: "1"
  PYTHONPATH: "."
  APEA_HTTP_USER_AGENT: "TeluAI-APEA-G/1.0"

jobs:
  continuous-engineer:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout autonomous branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 100
          token: ${{ secrets.APEA_GITHUB_TOKEN || github.token }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Build or load complete plan
        run: python -m scripts.apea_g_plan
      - name: Execute approved plan continuously
        run: python -m scripts.apea_g_entry
      - name: Report one-time plan gate
        if: ${{ always() }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path('.apea/continuous-state.json').read_text(encoding='utf-8'))
          plan = json.loads(Path('.apea/continuous-plan.json').read_text(encoding='utf-8'))
          print(json.dumps({
              'plan_approved': state.get('plan_approved') is True,
              'status': state.get('status'),
              'capability': state.get('capability'),
              'completed_capabilities': state.get('completed_capabilities', []),
              'planned_capabilities': len(plan.get('capabilities', [])),
          }, ensure_ascii=False))
          PY
