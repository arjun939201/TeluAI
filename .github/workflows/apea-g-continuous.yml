name: APEA-G Continuous Engineering

on:
  push:
    branches:
      - "apea-g/continuous-*"
  workflow_dispatch:
    inputs:
      branch:
        description: Autonomous branch to continue
        required: false
        default: "apea-g/continuous-boot"
        type: string
      approve_plan:
        description: Approve the persisted plan once and start autonomous execution
        required: false
        default: false
        type: boolean
      max_steps:
        description: Maximum roadmap steps for this autonomous run
        required: false
        default: "12"
        type: string
      max_repairs:
        description: Maximum CI repair attempts per step
        required: false
        default: "4"
        type: string
      merge:
        description: Merge the autonomous PR when every planned step is green
        required: false
        default: false
        type: boolean
  workflow_run:
    workflows: ["TeluAI CI"]
    types: [completed]

permissions:
  contents: write
  actions: write
  pull-requests: write
  issues: write

concurrency:
  group: apea-g-continuous-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

env:
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || secrets.GROQ_TOKEN }}
  GROQ_TOKEN: ${{ secrets.GROQ_TOKEN || secrets.GROQ_API_KEY }}
  GROQ_MODEL: ${{ vars.APEA_G_MODEL || 'openai/gpt-oss-120b' }}
  GROQ_URL: ${{ vars.GROQ_URL || 'https://api.groq.com/openai/v1/chat/completions' }}
  GITHUB_TOKEN: ${{ github.token }}
  GITHUB_REPOSITORY: ${{ github.repository }}
  APEA_MAX_STEPS: ${{ inputs.max_steps || '12' }}
  APEA_MAX_REPAIRS: ${{ inputs.max_repairs || '4' }}
  APEA_MERGE: ${{ inputs.merge || 'false' }}
  APEA_PLAN_APPROVED: ${{ inputs.approve_plan || 'false' }}
  PYTHONUNBUFFERED: "1"
  APEA_HTTP_USER_AGENT: "TeluAI-APEA-G/1.0"

jobs:
  continuous-engineer:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event.workflow_run.head_branch != '' && startsWith(github.event.workflow_run.head_branch, 'apea-g/continuous-'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout autonomous branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
          fetch-depth: 50

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Apply one-time plan approval
        if: github.event_name == 'workflow_dispatch' && inputs.approve_plan == true
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          state_path = Path('.apea/continuous-state.json')
          plan_path = Path('.apea/continuous-plan.json')
          if not state_path.exists() or not plan_path.exists():
              raise SystemExit('No persisted APEA-G plan exists yet; run the autonomous branch once to generate it.')
          state = json.loads(state_path.read_text(encoding='utf-8'))
          plan = json.loads(plan_path.read_text(encoding='utf-8'))
          if not plan.get('steps'):
              raise SystemExit('Cannot approve an empty APEA-G plan')
          capability = plan.get('capability')
          state['plan_approved'] = True
          state['approved_plan_capability'] = capability
          state['status'] = 'executing'
          plan['status'] = 'approved'
          plan['approval_required'] = False
          state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          plan_path.write_text(json.dumps(plan, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'Approved persisted APEA-G plan: {capability}')
          PY

      - name: Resume or start continuous autonomous developer
        env:
          APEA_MODE: ${{ github.event_name == 'workflow_run' && 'resume' || 'start' }}
        run: >-
          python -c "import os,runpy,urllib.request; O=urllib.request.Request; UA=os.environ['APEA_HTTP_USER_AGENT']; urllib.request.Request=lambda url,data=None,headers=None,origin_req_host=None,unverifiable=False,method=None: O(url,data=data,headers={**(headers or {}),'User-Agent':UA,'Accept':'application/json'},origin_req_host=origin_req_host,unverifiable=unverifiable,method=method); runpy.run_path('scripts/apea_g_async.py',run_name='__main__')"
