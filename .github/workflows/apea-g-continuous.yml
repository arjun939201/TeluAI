name: APEA-G Continuous Engineering

on:
  push:
    branches:
      - "apea-g/continuous-*"
  workflow_dispatch:
    inputs:
      approve_plan:
        description: Approve the persisted complete plan once and run it continuously
        required: false
        default: false
        type: boolean
      max_steps:
        description: Maximum steps per capability
        required: false
        default: "12"
        type: string
      max_repairs:
        description: Maximum CI repair attempts per step
        required: false
        default: "4"
        type: string
      merge:
        description: Merge the autonomous PR when every planned step is green
        required: false
        default: false
        type: boolean
  workflow_run:
    workflows: ["TeluAI CI"]
    types: [completed]

permissions:
  contents: write
  actions: write
  pull-requests: write
  issues: write

concurrency:
  group: apea-g-continuous-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

env:
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || secrets.GROQ_TOKEN }}
  GROQ_TOKEN: ${{ secrets.GROQ_TOKEN || secrets.GROQ_API_KEY }}
  GROQ_MODEL: ${{ vars.APEA_G_MODEL || 'openai/gpt-oss-120b' }}
  GROQ_URL: ${{ vars.GROQ_URL || 'https://api.groq.com/openai/v1/chat/completions' }}
  GITHUB_TOKEN: ${{ github.token }}
  GITHUB_REPOSITORY: ${{ github.repository }}
  APEA_MAX_STEPS: ${{ inputs.max_steps || '12' }}
  APEA_MAX_REPAIRS: ${{ inputs.max_repairs || '4' }}
  APEA_MERGE: ${{ inputs.merge || 'false' }}
  APEA_PLAN_APPROVED: ${{ inputs.approve_plan || 'false' }}
  PYTHONUNBUFFERED: "1"
  APEA_HTTP_USER_AGENT: "TeluAI-APEA-G/1.0"

jobs:
  continuous-engineer:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event.workflow_run.head_branch != '' && startsWith(github.event.workflow_run.head_branch, 'apea-g/continuous-'))
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout autonomous branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
          fetch-depth: 100

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Build or load complete plan
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: python -m scripts.apea_g_plan

      - name: Execute approved plan continuously
        if: github.event_name == 'workflow_dispatch' && inputs.approve_plan == true
        run: python -m scripts.apea_g_full

      - name: Resume autonomous plan after CI
        if: github.event_name == 'workflow_run'
        run: python -m scripts.apea_g_full

      - name: Hold for one-time plan approval
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          plan = json.loads(Path('.apea/continuous-plan.json').read_text(encoding='utf-8'))
          if plan.get('approval_required'):
              print(f"PLAN_READY: {len(plan.get('capabilities', []))} capabilities are persisted and awaiting the one-time approval checkpoint.")
          else:
              print("No approval checkpoint is required.")
          PY
