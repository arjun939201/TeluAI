services:
  - type: web
    name: melimi-telugu-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: MAX_VOCAB_MATCHES
        value: "8"
      - key: MAX_EXAMPLES
        value: "5"
