services:
  - type: web
    name: teluai
    runtime: python
    buildCommand: pip install -r requirements.txt
    # Use the same canonical ASGI composition as Docker/local production runs.
    startCommand: uvicorn app.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/ready
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_FALLBACK_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_ENABLE_FALLBACK
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: REQUIRE_AUTH
        value: "true"
      - key: COOKIE_SECURE
        value: "true"
      - key: SESSION_DAYS
        value: "30"
      - key: MAX_HISTORY_TURNS
        value: "4"
      - key: MAX_HISTORY_CHARS_PER_TURN
        value: "500"
      - key: MAX_USER_CHARS
        value: "2400"
      - key: MELIMI_PROFILE_CHARS
        value: "1200"
      - key: MELIMI_RELEVANT_CHARS
        value: "1800"
      - key: MAX_CONTEXT_CHARS
        value: "5000"
      - key: MAX_RESPONSE_TOKENS
        value: "1200"
      - key: TELUAI_OWNER_EMAIL
        sync: false
      - key: OWNER_EMAILS
        value: ""
      - key: CACHE_ENABLED
        value: "true"
