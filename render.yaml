services:
  - type: web
    name: teluai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: DATABASE_URL
        sync: false
      - key: REQUIRE_AUTH
        value: "true"
      - key: COOKIE_SECURE
        value: "true"
      - key: MAX_HISTORY_TURNS
        value: "4"
      - key: MAX_HISTORY_CHARS_PER_TURN
        value: "500"
      - key: MELIMI_PROFILE_CHARS
        value: "1200"
      - key: MELIMI_RELEVANT_CHARS
        value: "1800"
      - key: MAX_CONTEXT_CHARS
        value: "5000"
      - key: MAX_RESPONSE_TOKENS
        value: "1200"
      - key: TELUAI_OWNER_EMAIL
        sync: false
      - key: CACHE_ENABLED
        value: "true"
