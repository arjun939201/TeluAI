<!doctype html><html lang="te"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TeluAI — చర్యల జాడ</title><link rel="stylesheet" href="/static/css/professional.css"><link rel="stylesheet" href="/static/css/admin.css"></head><body><div class="admin-shell"><header class="admin-top"><div><h1 class="admin-title">చర్యల జాడ</h1><div class="admin-muted">Owner మరియు admin నిర్వహణ చర్యల audit trail.</div></div><button class="pill-btn" onclick="location.href='/'">AIకి వెనుకకు</button></header><nav class="admin-nav"><a href="/static/admin.html">సారాంశం</a><a href="/static/admin-language.html">భాషా నిలయం</a><a href="/static/admin-users.html">వాడుకరులు</a><a href="/static/admin-learning.html">ఆమోదాలు</a><a class="active" href="/static/admin-audit.html">చర్యల జాడ</a></nav><section class="admin-card"><div class="admin-toolbar"><input id="q" placeholder="చర్యలో వెతుకు…"><button class="secondary" id="refresh">తాజాగా చూడు</button></div><div id="list" class="admin-list"></div></section></div><script>const $=s=>document.querySelector(s);const api=async(u,o={})=>{const r=await fetch(u,{credentials:'same-origin',...o});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||'చిక్కు వచ్చింది');return d};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function load(){try{const d=await api('/admin/database/audit?limit=200');const q=$('#q').value.trim().toLowerCase();const a=(d.logs||[]).filter(x=>!q||JSON.stringify(x).toLowerCase().includes(q));$('#list').innerHTML=a.map(x=>`<article class="admin-row"><div class="admin-row-head"><b>${esc(x.action)}</b><span class="badge">${esc(x.target_type)}:${esc(x.target_id)}</span></div><div class="admin-muted" style="margin-top:7px">${esc(x.created_at)} · ${esc(x.actor_username||x.actor||'')}</div><pre style="white-space:pre-wrap;color:#cbd1dc">${esc(JSON.stringify(x.details||{},null,2))}</pre></article>`).join('')||'<div class="empty">చర్యల జాడ లేదు.</div>'}catch(e){$('#list').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}$('#refresh').onclick=load;let t;$('#q').oninput=()=>{clearTimeout(t);t=setTimeout(load,250)};async function boot(){try{const me=await api('/auth/me');if(!['owner','admin'].includes(me.role))throw Error('నిర్వాహక హక్కు కావాలి.');load()}catch(e){$('#list').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}boot();</script></body></html>
