<!doctype html><html lang="te"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TeluAI — చర్యల జాడ</title><link rel="stylesheet" href="/static/css/professional.css"><link rel="stylesheet" href="/static/css/admin.css"></head><body><div class="admin-shell"><header class="admin-top"><div class="admin-brand"><div class="logo">T</div><div><b>TeluAI</b><div class="admin-muted">నిర్వహణ చర్యల జాడ</div></div></div><button class="pill-btn" onclick="location.href='/'">AIకి వెనుకకు</button></header><nav class="admin-nav"><a href="/static/admin.html">సారాంశం</a><a href="/static/admin-language.html">భాషా నిలయం</a><a href="/static/admin-users.html">వాడుకరులు</a><a href="/static/admin-learning.html">ఆమోదాలు</a><a class="active" href="/static/admin-audit.html">చర్యల జాడ</a></nav><section class="admin-card"><div class="admin-section-head"><div><h1 class="admin-title">చర్యల జాడ</h1><p class="admin-muted">Owner మరియు admin చేసిన నిర్వహణ చర్యలను పరిశీలించండి.</p></div><button class="secondary" id="refresh">తాజాగా చూడు</button></div><div class="admin-toolbar"><input id="q" placeholder="చర్య, వాడుకరి లేదా లక్ష్యంలో వెతుకు…"><select id="type"><option value="">అన్ని లక్ష్యాలు</option><option value="user">user</option><option value="language">language</option><option value="learning">learning</option></select></div><div id="list" class="admin-list"></div></section></div><script>const $=s=>document.querySelector(s);const api=async(u,o={})=>{const r=await fetch(u,{credentials:'same-origin',...o});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||'చిక్కు వచ్చింది');return d};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));let all=[];function render(){const q=$('#q').value.trim().toLowerCase(),type=$('#type').value;const a=all.filter(x=>(!q||JSON.stringify(x).toLowerCase().includes(q))&&(!type||x.target_type===type));$('#list').innerHTML=a.map(x=>`<article class="admin-row"><div class="admin-row-head"><div><b>${esc(x.action)}</b> <span class="badge">${esc(x.target_type)}:${esc(x.target_id)}</span></div><span class="admin-muted">${esc(x.created_at)}</span></div><div class="admin-content"><div class="admin-muted">చేసినవారు: <b>${esc(x.actor_username||x.actor||'తెలియదు')}</b></div><pre class="admin-code">${esc(JSON.stringify(x.details||{},null,2))}</pre></div></article>`).join('')||'<div class="empty"><strong>చర్యల జాడ లేదు</strong>మీ ఫిల్టర్‌కు సరిపోలే చర్యలు లేవు.</div>'}async function load(){try{const d=await api('/admin/database/audit?limit=200');all=d.logs||[];render()}catch(e){$('#list').innerHTML=`<div class="admin-error">${esc(e.message)}</div>`}}$('#refresh').onclick=load;$('#q').oninput=render;$('#type').onchange=render;async function boot(){try{const me=await api('/auth/me');if(!['owner','admin'].includes(me.role))throw Error('నిర్వాహక హక్కు కావాలి.');load()}catch(e){$('#list').innerHTML=`<div class="admin-error">${esc(e.message)}</div>`}}boot();</script></body></html>
