<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Forgot password — TeluAI</title>
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
<main class="forgot-page">
  <div class="forgot-card">
    <div class="auth-brand">TeluAI</div>
    <div class="auth-subtitle">Password recovery</div>

    <section id="emailStep">
      <h1>Forgot password?</h1>
      <p>Enter the email address used for your TeluAI account. A verification code will be sent to that email.</p>
      <form id="sendCodeForm">
        <input id="email" class="auth-input" type="email" required autocomplete="email" placeholder="Email address">
        <button id="sendCodeButton" class="auth-submit" type="submit">Send verification code</button>
      </form>
    </section>

    <section id="codeStep" hidden>
      <h1>Enter verification code</h1>
      <p>Enter the 6-digit code sent to your email.</p>
      <form id="verifyCodeForm">
        <input id="code" class="auth-input" type="text" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" required autocomplete="one-time-code" placeholder="6-digit code">
        <button id="verifyCodeButton" class="auth-submit" type="submit">Verify code</button>
      </form>
    </section>

    <div id="result" class="auth-error" aria-live="polite"></div>
    <p><a href="/">Back to login</a></p>
  </div>
</main>

<script>
const emailStep = document.getElementById("emailStep");
const codeStep = document.getElementById("codeStep");
const emailInput = document.getElementById("email");
const codeInput = document.getElementById("code");
const result = document.getElementById("result");

document.getElementById("sendCodeForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = emailInput.value.trim();
  if (!email) {
    emailInput.reportValidity();
    return;
  }

  const button = document.getElementById("sendCodeButton");
  button.disabled = true;
  result.style.color = "";
  result.textContent = "Sending verification code...";

  try {
    const res = await fetch("/auth/forgot-password", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      credentials: "same-origin",
      body: JSON.stringify({email})
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.detail || "Unable to send the verification code.");

    result.style.color = "#8ed9a0";
    result.textContent = data.message || "If the account exists, a verification code has been sent.";
    emailInput.readOnly = true;
    emailStep.hidden = true;
    codeStep.hidden = false;
    codeInput.focus();
  } catch (err) {
    result.style.color = "#ef7777";
    result.textContent = err.message || "Unable to send the verification code.";
  } finally {
    button.disabled = false;
  }
});

document.getElementById("verifyCodeForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = emailInput.value.trim();
  const code = codeInput.value.trim();

  if (!email) {
    result.style.color = "#ef7777";
    result.textContent = "Email is required.";
    emailStep.hidden = false;
    codeStep.hidden = true;
    emailInput.focus();
    return;
  }
  if (!/^\d{6}$/.test(code)) {
    result.style.color = "#ef7777";
    result.textContent = "Enter the 6-digit verification code.";
    codeInput.focus();
    return;
  }

  const button = document.getElementById("verifyCodeButton");
  button.disabled = true;
  result.style.color = "";
  result.textContent = "Verifying code...";

  try {
    const res = await fetch("/auth/verify-reset-code", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      credentials: "same-origin",
      body: JSON.stringify({email, code})
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.detail || "The verification code is invalid or expired.");

    sessionStorage.setItem("teluai_reset_token", data.reset_token);
    sessionStorage.setItem("teluai_reset_email", email);
    location.href = "/static/reset-password.html";
  } catch (err) {
    result.style.color = "#ef7777";
    result.textContent = err.message || "The verification code is invalid or expired.";
  } finally {
    button.disabled = false;
  }
});
</script>
</body>
</html>
