<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reset password — TeluAI</title>
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
<main class="forgot-page">
  <div class="forgot-card">
    <div class="auth-brand">TeluAI</div>
    <div class="auth-subtitle">Create a new password</div>
    <h1>Reset password</h1>
    <p>Choose a new password for your TeluAI account.</p>

    <form id="resetForm">
      <div class="password-field"><input id="newPassword" class="auth-input" type="password" minlength="8" maxlength="128"
             placeholder="New password" required autocomplete="new-password"><button class="password-toggle" type="button" data-password-target="newPassword">Show</button></div>
      <div class="password-field"><input id="confirmPassword" class="auth-input" type="password" minlength="8" maxlength="128"
             placeholder="Confirm new password" required autocomplete="new-password"><button class="password-toggle" type="button" data-password-target="confirmPassword">Show</button></div>
      <button id="resetButton" class="auth-submit" type="submit">Update password</button>
    </form>

    <div id="resetResult" class="auth-error" aria-live="polite"></div>
  </div>
</main>

<script>
const token = sessionStorage.getItem("teluai_reset_token");
const form = document.getElementById("resetForm");
const result = document.getElementById("resetResult");

if (!token) {
  result.style.color = "#ef7777";
  result.textContent = "Your verification session is missing or expired. Please request a new code.";
  form.style.display = "none";
  setTimeout(() => location.href = "/static/forgot-password.html", 1800);
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const password = document.getElementById("newPassword").value;
  const confirm = document.getElementById("confirmPassword").value;

  if (password !== confirm) {
    result.style.color = "#ef7777";
    result.textContent = "Passwords do not match.";
    return;
  }

  const button = document.getElementById("resetButton");
  button.disabled = true;
  result.style.color = "";
  result.textContent = "Updating password...";

  try {
    const res = await fetch("/auth/reset-password", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      credentials: "same-origin",
      body: JSON.stringify({token, password})
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.detail || "Could not reset your password.");

    sessionStorage.removeItem("teluai_reset_token");
    sessionStorage.removeItem("teluai_reset_email");

    result.style.color = "#8ed9a0";
    result.textContent = "Password updated. Taking you to TeluAI...";
    setTimeout(() => location.href = "/", 700);
  } catch (err) {
    result.style.color = "#ef7777";
    result.textContent = err.message || "Could not reset your password.";
    button.disabled = false;
  }
});
document.querySelectorAll(".password-toggle[data-password-target]").forEach(button=>{
  button.addEventListener("click",()=>{
    const input=document.getElementById(button.dataset.passwordTarget); if(!input)return;
    const visible=input.type==="text"; input.type=visible?"password":"text";
    button.textContent=visible?"Show":"Hide"; button.setAttribute("aria-pressed",String(!visible));
  });
});
</script>
</body>
</html>
