<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password — TeluAI</title><link rel="stylesheet" href="/static/css/styles.css"></head><body><main style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px"><section class="auth-card"><div class="auth-brand">TeluAI</div><div class="auth-subtitle">Reset your password</div><form id="resetForm"><input id="newPassword" class="auth-input" type="password" minlength="8" maxlength="128" placeholder="New password" required autocomplete="new-password"><input id="confirmPassword" class="auth-input" type="password" minlength="8" maxlength="128" placeholder="Confirm password" required autocomplete="new-password"><button class="auth-submit" type="submit">Reset password</button><div id="resetResult" class="auth-error"></div></form></section></main><script>const q=new URLSearchParams(location.search),token=q.get('token')||'',form=document.getElementById('resetForm'),result=document.getElementById('resetResult');form.addEventListener('submit',async e=>{e.preventDefault();const p=document.getElementById('newPassword').value,c=document.getElementById('confirmPassword').value;if(p!==c){result.textContent='Passwords do not match.';return}result.textContent='Resetting…';try{const r=await fetch('/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:p})});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||'Could not reset password');result.style.color='#8ed9a0';result.textContent=d.message||'Password reset successfully.';setTimeout(()=>location.href='/',1200)}catch(e){result.style.color='#ef7777';result.textContent=e.message}});</script></body></html>
