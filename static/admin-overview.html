<!doctype html><html lang="te"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TeluAI — సారాంశం</title><link rel="stylesheet" href="/static/css/professional.css"><link rel="stylesheet" href="/static/css/admin.css"><style>body{background:transparent}.page{padding:28px;max-width:1200px;margin:auto}.intro{margin-bottom:18px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#11141b;border:1px solid var(--line);border-radius:15px;padding:17px}.card b{display:block;font-size:24px;margin-top:6px}.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:16px}.quick a{border:1px solid var(--line);background:#11141b;border-radius:13px;padding:15px;text-decoration:none;color:#dce1ea}.quick a:hover{background:#171a22;border-color:#514a86}.muted{color:var(--muted);font-size:12px;line-height:1.5}@media(max-width:800px){.page{padding:18px 14px}.cards{grid-template-columns:repeat(2,1fr)}.quick{grid-template-columns:1fr}} </style></head><body><main class="page"><section class="intro"><h1 class="admin-title">నిర్వాహక సారాంశం</h1><p class="muted">TeluAI నిర్వహణ స్థితిని ఒక్క చూపులో చూడండి. వివరాల కోసం పై tabs ఉపయోగించండి.</p></section><section id="stats" class="cards"></section><section class="quick"><a href="#" onclick="parent.document.querySelector('[data-page=admin-language.html]').click();return false"><b>మేలిమి భాషా నిలయం</b><div class="muted">భాషా తెలిమి, నుడి, వ్యాకరణం మరియు ఇతర కంటెంట్.</div></a><a href="#" onclick="parent.document.querySelector('[data-page=admin-users.html]').click();return false"><b>వాడుకరులు</b><div class="muted">ఖాతాలు మరియు పాత్రలు.</div></a></section></main><script>const api=async u=>{const r=await fetch(u,{credentials:'same-origin'});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||'చిక్కు వచ్చింది');return d};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function boot(){try{const me=await api('/auth/me');if(!['owner','admin'].includes(me.role))throw Error('నిర్వాహక హక్కు కావాలి.');const d=await api('/admin/database/stats');document.querySelector('#stats').innerHTML=Object.entries(d.stats).map(([k,v])=>`<article class="card"><div class="muted">${esc(k.replaceAll('_',' '))}</div><b>${esc(v)}</b></article>`).join('')}catch(e){document.querySelector('.page').innerHTML='<div class="card">'+esc(e.message)+'</div>'}}boot();</script></body></html>
