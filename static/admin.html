<!doctype html><html lang="te"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TeluAI — యజమాని / నిర్వాహకుడు</title><link rel="stylesheet" href="/static/css/professional.css"><style>.dash{width:min(1180px,100%);margin:auto;padding:28px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#11141b;border:1px solid var(--line);border-radius:15px;padding:17px}.stat b{font-size:25px}.muted{color:var(--muted);font-size:12px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}.badge{padding:4px 8px;border-radius:99px;background:#1d2130;font-size:11px}.danger{color:#fb7185}.section{margin-top:24px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.dash{padding:18px}.table{display:block;overflow:auto}}</style></head><body><div class="dash"><header class="topbar" style="margin:-28px -28px 25px"><div><b>యజమాని / నిర్వాహకుడు</b><div class="muted">TeluAI పనివీడు నిర్వహణ</div></div><button class="pill-btn" onclick="location.href='/'">AIకి వెనుకకు</button></header><div id="guard" class="card">హక్కులు చూస్తున్నాం…</div><div id="console" class="hidden"><div class="grid" id="stats"></div><div class="section card"><div class="modal-head"><div><h2>నుడి డేటాబేసు</h2><span class="muted">PostgreSQLలో ఉన్న మేలిమి తెలుగు తెలిమి</span></div><label class="primary" style="display:inline-block">ప్యాకేజీ ఎక్కించు<input id="upload" type="file" accept=".txt,.md,.json,.zip" hidden></label></div><pre id="language" style="white-space:pre-wrap;color:#aeb5c4;max-height:240px;overflow:auto"></pre></div><div class="section card"><h2>వాడుకరులు</h2><div style="overflow:auto"><table class="table"><thead><tr><th>వాడుకరి</th><th>Email</th><th>పాత్ర</th><th>స్థితి</th><th>చర్యలు</th></tr></thead><tbody id="users"></tbody></table></div></div><div class="section card"><h2>ఆమోదం కోసం వచ్చిన తెలిమి</h2><div id="learning"></div></div><div class="section card"><h2>చర్యల జాడ</h2><div id="audit"></div></div></div></div><script>const $=s=>document.querySelector(s);const api=async(u,o={})=>{const r=await fetch(u,{credentials:'same-origin',...o});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||'చిక్కు వచ్చింది');return d};const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function boot(){try{const me=await api('/auth/me');if(!['owner','admin'].includes(me.role))throw Error('నిర్వాహక హక్కు కావాలి.');$('#guard').classList.add('hidden');$('#console').classList.remove('hidden');await Promise.all([stats(),language(),users(),learning(),audit()])}catch(e){$('#guard').textContent=e.message}}async function stats(){const d=await api('/admin/database/stats');$('#stats').innerHTML=Object.entries(d.stats).map(([k,v])=>`<div class="card stat"><div class="muted">${esc(k.replaceAll('_',' '))}</div><b>${esc(v)}</b></div>`).join('')}async function language(){const d=await api('/admin/database/language?limit=60');$('#language').textContent=JSON.stringify(d.language,null,2)}async function users(){const me=await api('/auth/me'),d=await api('/admin/database/users');$('#users').innerHTML=d.users.map(u=>{const can=me.role==='owner'&&u.role!=='owner'&&u.id!==me.id;return `<tr><td><b>${esc(u.username)}</b></td><td>${esc(u.email)}</td><td><span class="badge">${esc(u.role)}</span></td><td>${u.is_active?'చురుకు':'నిలిపివేత'}</td><td>${can?`<select id="r${u.id}"><option value="user">user</option><option value="admin">admin</option></select> <button class="secondary" onclick="role(${u.id})">పాత్ర</button> <button class="secondary" onclick="active(${u.id},${!u.is_active})">${u.is_active?'నిలిపివేయి':'చురుకు చేయి'}</button> <button class="secondary danger" onclick="del(${u.id})">తొలగించు</button>`:'కాపాడబడింది'}</td></tr>`}).join('')}async function role(id){await api(`/admin/users/${id}/role?role=${encodeURIComponent($('#r'+id).value)}`,{method:'POST'});users();audit()}async function active(id,v){await api(`/admin/users/${id}/active?active=${v}`,{method:'POST'});users();stats();audit()}async function del(id){if(!confirm('ఈ వాడుకరి మరియు అతని దాచిన తెలిమిని తొలగించాలా?'))return;await api('/admin/users/'+id,{method:'DELETE'});users();stats();audit()}async function learning(){const d=await api('/admin/learning/pending');$('#learning').innerHTML=(d.candidates||[]).map(c=>`<div class="card" style="margin:8px 0"><b>#${c.id}</b> ${esc(c.knowledge_type)}<pre>${esc(JSON.stringify(c.payload,null,2))}</pre><button class="primary" onclick="review(${c.id},true)">ఆమోదించు</button> <button class="secondary" onclick="review(${c.id},false)">తిరస్కరించు</button></div>`).join('')||'<span class="muted">ఆమోదం కోసం ఏదీ లేదు.</span>'}async function review(id,a){await api('/admin/learning/'+id+'/'+(a?'approve':'reject'),{method:'POST'});learning();stats();audit()}async function audit(){const d=await api('/admin/database/audit?limit=80');$('#audit').innerHTML=(d.logs||[]).map(x=>`<div class="card" style="margin:8px 0"><b>${esc(x.action)}</b> · ${esc(x.target_type)}:${esc(x.target_id)}<div class="muted">${new Date(x.created_at).toLocaleString()}</div></div>`).join('')||'<span class="muted">చర్యల జాడ లేదు.</span>'}$('#upload').onchange=async e=>{const f=e.target.files[0];if(!f)return;const fd=new FormData();fd.append('file',f);try{await api('/melimi/content/upload',{method:'POST',body:fd});alert('నుడి ప్యాకేజీ ఎక్కించబడింది');language();stats();audit()}catch(x){alert(x.message)}e.target.value=''};boot();</script></body></html>
