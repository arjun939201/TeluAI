<!doctype html>
<html lang="te"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090a0f"><title>TeluAI — నిర్వాహక పనివీడు</title><link rel="stylesheet" href="/static/css/professional.css"><link rel="stylesheet" href="/static/css/admin.css"><style>
body{overflow:hidden}.admin-app{height:100vh;display:flex;flex-direction:column}.admin-head{flex:none;padding:14px 22px;margin:0;border-bottom:1px solid var(--line);background:rgba(9,10,15,.9);backdrop-filter:blur(18px)}.admin-head-left{display:flex;align-items:center;gap:11px;min-width:0}.admin-head-left .logo{width:36px;height:36px}.admin-head-title{min-width:0}.admin-head-title b{display:block;font-size:15px}.admin-head-title span{display:block;color:var(--muted);font-size:11px}.admin-tabs{flex:none;display:flex;gap:5px;overflow-x:auto;padding:10px 22px;border-bottom:1px solid var(--line);background:var(--panel);scrollbar-width:none}.admin-tabs::-webkit-scrollbar{display:none}.admin-tab{flex:none;border:1px solid transparent;background:transparent;color:var(--muted);border-radius:10px;padding:9px 13px;font-size:13px;white-space:nowrap}.admin-tab:hover{background:var(--panel2);color:var(--text)}.admin-tab.active{background:color-mix(in srgb,var(--accent) 20%,var(--panel2));color:var(--text);border-color:var(--accent)}.admin-frame-wrap{flex:1;min-height:0;background:var(--bg)}#adminFrame{width:100%;height:100%;border:0;display:block}.admin-mobile-actions{display:none}@media(max-width:700px){.admin-head{padding:11px 12px}.admin-tabs{padding:8px 10px}.admin-head .pill-btn{display:none}.admin-mobile-actions{display:block;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:9px;padding:7px 9px}}
</style></head>
<body><div class="admin-app">
<header class="admin-head"><div class="admin-head-left"><div class="logo">T</div><div class="admin-head-title"><b>TeluAI</b><span>యజమాని / నిర్వాహకుడు</span></div></div><div style="display:flex;gap:8px;align-items:center"><button class="admin-mobile-actions" onclick="location.href='/'">AI</button><button class="pill-btn" onclick="location.href='/'">AIకి వెనుకకు</button></div></header>
<nav class="admin-tabs" role="tablist" aria-label="నిర్వాహక భాగాలు">
<button class="admin-tab active" data-page="admin-overview.html" role="tab">సారాంశం</button><button class="admin-tab" data-page="admin-language.html" role="tab">మేలిమి భాషా నిలయం</button><button class="admin-tab" data-page="admin-users.html" role="tab">వాడుకరులు</button><button class="admin-tab" data-page="admin-learning.html" role="tab">ఆమోదాలు</button><button class="admin-tab" data-page="admin-audit.html" role="tab">చర్యల జాడ</button></nav>
<main class="admin-frame-wrap"><iframe id="adminFrame" title="నిర్వాహక భాగం" src="/static/admin-overview.html"></iframe></main></div>
<script>
const tabs=[...document.querySelectorAll('.admin-tab')],frame=document.querySelector('#adminFrame');
const uiKey='teluai_ui_settings';
function readTheme(){try{return JSON.parse(localStorage.getItem(uiKey)||'{}').theme||'dark'}catch{return'dark'}}
function effectiveTheme(theme){return theme==='system'?(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'):theme}
function applyAdminTheme(){const theme=effectiveTheme(readTheme());document.documentElement.dataset.theme=theme;document.querySelector('meta[name="theme-color"]')?.setAttribute('content',theme==='light'?'#f5f7fa':'#090a0f');try{if(frame.contentDocument)frame.contentDocument.documentElement.dataset.theme=theme}catch{}}
function activate(tab,replace=true){tabs.forEach(x=>{const on=x===tab;x.classList.toggle('active',on);x.setAttribute('aria-selected',String(on))});frame.src='/static/'+tab.dataset.page;if(replace)history.replaceState(null,'','#'+tab.dataset.page.replace('.html',''));}
tabs.forEach(t=>t.onclick=()=>activate(t));
frame.addEventListener('load',applyAdminTheme);
window.addEventListener('storage',e=>{if(e.key===uiKey)applyAdminTheme()});
window.matchMedia('(prefers-color-scheme: light)').addEventListener?.('change',()=>{if(readTheme()==='system')applyAdminTheme()});
const hash=location.hash.slice(1);const initial=tabs.find(t=>t.dataset.page.replace('.html','')===hash);if(initial)activate(initial,false);window.addEventListener('hashchange',()=>{const t=tabs.find(x=>x.dataset.page.replace('.html','')===location.hash.slice(1));if(t)activate(t,false)});applyAdminTheme();
</script></body></html>
