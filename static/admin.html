<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TeluAI Admin</title><style>body{font-family:system-ui;background:#0d0d10;color:#eee;max-width:1100px;margin:30px auto;padding:20px}button,select{padding:9px 12px;margin:3px;background:#18181d;color:#eee;border:1px solid #333;border-radius:7px;cursor:pointer}.card{border:1px solid #333;border-radius:10px;padding:16px;margin:12px 0;background:#111116}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.stat{padding:14px;border:1px solid #333;border-radius:8px}.muted{color:#999}.danger{border-color:#773b3b}.role-owner{color:#ffd166}.role-admin{color:#8ed9a0}.role-user{color:#aaa}pre{white-space:pre-wrap;overflow:auto}.hidden{display:none}.msg{padding:10px;margin:10px 0;border-radius:7px;background:#18181d}</style></head><body><h1>TeluAI Administration</h1><div id="msg" class="msg">Checking your account…</div><div id="app" class="hidden"><p id="identity"></p><div id="stats" class="grid"></div><h2>Database Language Snapshot</h2><div id="language"></div><h2>Users</h2><div id="users"></div><h2>Pending Melimi Learning</h2><div id="learning"></div><h2>Audit Log</h2><div id="audit"></div></div><script>
const $=id=>document.getElementById(id);function msg(t){$('msg').textContent=t}async function api(url,opt={}){const r=await fetch(url,{credentials:'same-origin',...opt});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.detail||'Request failed');return d}
async function boot(){try{const me=await api('/auth/me');if(!['admin','owner'].includes(me.role))throw new Error('Administrator permission required.');$('app').classList.remove('hidden');$('identity').textContent=`Signed in as ${me.username} (${me.role.toUpperCase()})`;msg('');await Promise.all([loadStats(),loadLanguage(),loadUsers(),loadLearning(),loadAudit()])}catch(e){msg(e.message)}}
async function loadStats(){const d=await api('/admin/database/stats');const s=d.stats;$('stats').innerHTML=Object.entries(s).map(([k,v])=>`<div class="stat"><b>${k.replaceAll('_',' ')}</b><br>${v}</div>`).join('')}
async function loadLanguage(){const d=await api('/admin/database/language?limit=40');const l=d.language;$('language').innerHTML='<div class="card"><b>Recent roots</b><pre>'+JSON.stringify(l.roots,null,2)+'</pre></div><div class="card"><b>Recent rules</b><pre>'+JSON.stringify(l.rules,null,2)+'</pre></div>'}
async function loadUsers(){const d=await api('/admin/database/users');const me=await api('/auth/me');$('users').innerHTML=d.users.map(u=>{const owner=u.role==='owner',self=u.id===me.id;const controls=me.role==='owner'&&!owner&&!self?`<select id="role-${u.id}"><option value="user" ${u.role==='user'?'selected':''}>user</option><option value="admin" ${u.role==='admin'?'selected':''}>admin</option></select><button onclick="setRole(${u.id})">Set role</button><button onclick="setActive(${u.id},${!u.is_active})">${u.is_active?'Disable':'Enable'}</button><button class="danger" onclick="removeUser(${u.id})">Delete</button>`:'';return `<div class="card"><b>${u.username}</b> — ${u.email}<br><span class="role-${u.role}">${u.role.toUpperCase()}</span> · ${u.is_active?'active':'disabled'} · created ${new Date(u.created_at).toLocaleString()}<div>${controls}</div></div>`}).join('')||'<p>No users.</p>'}
async function setRole(id){const role=$(`role-${id}`).value;try{await api(`/admin/users/${id}/role?role=${encodeURIComponent(role)}`,{method:'POST'});await loadUsers();await loadAudit()}catch(e){alert(e.message)}}async function setActive(id,active){try{await api(`/admin/users/${id}/active?active=${active}`,{method:'POST'});await loadUsers();await loadStats();await loadAudit()}catch(e){alert(e.message)}}async function removeUser(id){if(!confirm('Delete this user and their owned data?'))return;try{await api(`/admin/users/${id}`,{method:'DELETE'});await Promise.all([loadUsers(),loadStats(),loadAudit()])}catch(e){alert(e.message)}}
async function loadLearning(){const d=await api('/admin/learning/pending');$('learning').innerHTML=(d.candidates||[]).map(c=>`<div class="card"><b>#${c.id}</b> ${c.knowledge_type}<pre>${JSON.stringify(c.payload,null,2)}</pre><button onclick="review(${c.id},true)">Approve</button><button onclick="review(${c.id},false)">Reject</button></div>`).join('')||'<p>No pending candidates.</p>'}async function review(id,approve){try{await api('/admin/learning/'+id+'/'+(approve?'approve':'reject'),{method:'POST'});await Promise.all([loadLearning(),loadStats(),loadAudit()])}catch(e){alert(e.message)}}
async function loadAudit(){const d=await api('/admin/database/audit?limit=100');$('audit').innerHTML=(d.logs||[]).map(x=>`<div class="card"><b>${x.action}</b> — ${x.target_type}:${x.target_id}<br><span class="muted">${new Date(x.created_at).toLocaleString()}</span><pre>${JSON.stringify(x.details,null,2)}</pre></div>`).join('')||'<p>No audit records.</p>'}boot();</script></body></html>
