<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TeluAI — Melimi Learning Review</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{color-scheme:dark;--bg:#0b0b0c;--surface:#171719;--hover:#1d1d20;--border:#29292d;--text:#f2f2f3;--secondary:#b1b1b7;--muted:#77777e;--melimi:#d9a441;--success:#6fd38a;--danger:#ef7777}
  body{background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Telugu",sans-serif;padding:28px;max-width:920px;margin:0 auto}
  h1{font-size:20px;margin-bottom:4px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:20px}
  .token-row{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap}
  input[type=password],input[type=text]{background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:9px 11px;font-size:13px;font-family:inherit;flex:1;min-width:200px}
  button{background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:9px 14px;font-size:13px;font-family:inherit;cursor:pointer}
  button:hover{background:var(--hover)}
  button.approve{border-color:rgba(111,211,138,.4);color:var(--success)}
  button.reject{border-color:rgba(239,119,119,.4);color:var(--danger)}
  .stats{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 16px;min-width:110px}
  .stat .n{font-size:20px;font-weight:700}
  .stat .l{color:var(--muted);font-size:11px;margin-top:2px}
  .tabs{display:flex;gap:6px;margin-bottom:16px}
  .tabs button.active{background:var(--hover);color:var(--melimi);border-color:rgba(217,164,65,.3)}
  .list{display:flex;flex-direction:column;gap:10px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
  .row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .std{font-size:16px;font-weight:600}
  .arrow{color:var(--muted)}
  .mel{font-size:16px;font-weight:600;color:var(--melimi)}
  .meta{color:var(--muted);font-size:11px;margin-top:6px}
  .msg{color:var(--secondary);font-size:12px;margin-top:6px;font-style:italic}
  .actions{display:flex;gap:8px;margin-top:10px}
  .empty{color:var(--muted);font-size:13px;padding:30px 0;text-align:center}
  .error{color:var(--danger);font-size:13px;margin-bottom:14px}
</style>
</head>
<body>
  <h1>Melimi Telugu — Learning Review</h1>
  <div class="sub">Word/rule mappings proposed during chat, awaiting approval before they enter the corpus.</div>

  <div class="token-row">
    <input type="password" id="tokenInput" placeholder="Admin token (X-Admin-Token)">
    <button id="saveTokenBtn">Save</button>
    <button id="refreshBtn">Refresh</button>
  </div>

  <div id="errorBox" class="error" style="display:none"></div>

  <div class="stats" id="stats"></div>

  <div class="tabs" id="tabs">
    <button data-status="pending" class="active">Pending</button>
    <button data-status="approved">Approved</button>
    <button data-status="rejected">Rejected</button>
  </div>

  <div class="list" id="list"><div class="empty">Enter your admin token and press Refresh.</div></div>

<script>
const API = '';
let currentStatus = 'pending';

function getToken(){ return localStorage.getItem('teluai_admin_token') || ''; }
function setToken(t){ localStorage.setItem('teluai_admin_token', t); }

document.getElementById('tokenInput').value = getToken();

document.getElementById('saveTokenBtn').onclick = () => {
  setToken(document.getElementById('tokenInput').value.trim());
  loadAll();
};
document.getElementById('refreshBtn').onclick = loadAll;

document.getElementById('tabs').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-status]');
  if (!btn) return;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentStatus = btn.dataset.status;
  loadCandidates();
});

async function apiCall(path, options = {}) {
  const token = getToken();
  const res = await fetch(API + path, {
    ...options,
    headers: { ...(options.headers || {}), 'X-Admin-Token': token },
  });
  if (!res.ok) {
    const detail = await res.text();
    throw new Error(`${res.status}: ${detail}`);
  }
  return res.json();
}

function showError(msg) {
  const box = document.getElementById('errorBox');
  if (!msg) { box.style.display = 'none'; box.textContent = ''; return; }
  box.style.display = 'block';
  box.textContent = msg;
}

async function loadStats() {
  const data = await apiCall('/admin/learning/stats');
  const stats = document.getElementById('stats');
  stats.innerHTML = '';
  const entries = [
    ['Pending', data.pending ?? 0],
    ['Approved', data.approved ?? 0],
    ['Rejected', data.rejected ?? 0],
    ['In corpus', data.approved_knowledge_entries ?? 0],
  ];
  for (const [label, n] of entries) {
    const el = document.createElement('div');
    el.className = 'stat';
    el.innerHTML = `<div class="n">${n}</div><div class="l">${label}</div>`;
    stats.appendChild(el);
  }
}

async function loadCandidates() {
  const data = await apiCall(`/admin/learning/pending?status=${currentStatus}`);
  const list = document.getElementById('list');
  list.innerHTML = '';
  if (!data.candidates || data.candidates.length === 0) {
    list.innerHTML = '<div class="empty">Nothing here.</div>';
    return;
  }
  for (const c of data.candidates) {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="row">
        <span class="std">${escapeHtml(c.standard_root || '—')}</span>
        <span class="arrow">→</span>
        <span class="mel">${escapeHtml(c.melimi_root || '—')}</span>
      </div>
      <div class="meta">source: ${escapeHtml(c.source)} · kind: ${escapeHtml(c.kind)} · ${escapeHtml(c.created_at || '')}</div>
      ${c.proposed_message ? `<div class="msg">"${escapeHtml(c.proposed_message)}"</div>` : ''}
      ${c.status === 'pending' ? `
        <div class="actions">
          <button class="approve" data-id="${c.id}" data-action="approve">Approve</button>
          <button class="reject" data-id="${c.id}" data-action="reject">Reject</button>
        </div>` : `<div class="meta">status: ${escapeHtml(c.status)}${c.reviewer_note ? ' · note: ' + escapeHtml(c.reviewer_note) : ''}</div>`}
    `;
    list.appendChild(card);
  }
}

document.getElementById('list').addEventListener('click', async (e) => {
  const btn = e.target.closest('button[data-action]');
  if (!btn) return;
  const id = btn.dataset.id;
  const action = btn.dataset.action;
  btn.disabled = true;
  try {
    await apiCall(`/admin/learning/${id}/${action}`, { method: 'POST' });
    await loadAll();
  } catch (err) {
    showError(err.message);
    btn.disabled = false;
  }
});

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

async function loadAll() {
  showError('');
  if (!getToken()) {
    showError('Enter your admin token first.');
    return;
  }
  try {
    await Promise.all([loadStats(), loadCandidates()]);
  } catch (err) {
    showError(err.message);
  }
}

if (getToken()) loadAll();
</script>
</body>
</html>
