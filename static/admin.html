<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TeluAI Admin — Learning</title><style>body{font-family:system-ui;background:#0d0d10;color:#eee;max-width:1000px;margin:40px auto;padding:20px}input,button,textarea{padding:10px;margin:5px;background:#18181d;color:#eee;border:1px solid #333;border-radius:7px}button{cursor:pointer}.card{border:1px solid #333;border-radius:10px;padding:16px;margin:12px 0}.ok{color:#8ed9a0}.bad{color:#ef7777}</style></head><body><h1>TeluAI Learning Review</h1><p>Pending chat-learned Melimi knowledge. Approval extends runtime knowledge; it does not overwrite the authoritative corpus.</p><input id="token" type="password" placeholder="ADMIN_TOKEN"><button onclick="load()">Load</button><div id="list"></div><script>async function load(){const t=document.getElementById('token').value;const r=await fetch('/admin/learning/pending',{headers:{'X-Admin-Token':t}});const d=await r.json();if(!r.ok){document.getElementById('list').innerHTML='<p class="bad">'+(d.detail||'Failed')+'</p>';return}document.getElementById('list').innerHTML=(d.candidates||[]).map(c=>`<div class="card"><b>#${c.id}</b> ${c.knowledge_type}<pre>${JSON.stringify(c.payload,null,2)}</pre><button onclick="review(${c.id},true)">Approve</button><button onclick="review(${c.id},false)">Reject</button></div>`).join('')||'<p>No pending candidates.</p>'}async function review(id,approve){const t=document.getElementById('token').value;await fetch('/admin/learning/'+id+'/'+(approve?'approve':'reject'),{method:'POST',headers:{'X-Admin-Token':t}});load()}</script></body></html>
