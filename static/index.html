<!doctype html>
<html lang="te">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TeluAI</title>
<link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
<main class="app">
<header>
<h1>TeluAI</h1>
<p>తెలుగు భాషా మాటలాడింపు తోడ్పాటి</p>
<div class="modes">
<button data-mode="standard">Standard Telugu</button>
<button data-mode="melimi" class="active">Melimi Telugu</button>
</div>
</header>
<section id="chat"></section>
<form id="form">
<input id="message" autocomplete="off" placeholder="Telugu or Roman Telugu...">
<button>Send</button>
</form>
</main>
<script src="/static/js/chatbot.js"></script>
</body>
</html>
