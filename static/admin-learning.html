<!doctype html><html lang="te"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TeluAI — ఆమోదాలు</title><link rel="stylesheet" href="/static/css/professional.css"><link rel="stylesheet" href="/static/css/admin.css"></head><body><div class="admin-shell"><header class="admin-top"><div><h1 class="admin-title">ఆమోదాలు</h1><div class="admin-muted">వాడుకరులు సమర్పించిన మేలిమి భాషా తెలిమిని పరిశీలించు.</div></div><button class="pill-btn" onclick="location.href='/'">AIకి వెనుకకు</button></header><nav class="admin-nav"><a href="/static/admin.html">సారాంశం</a><a href="/static/admin-language.html">భాషా నిలయం</a><a href="/static/admin-users.html">వాడుకరులు</a><a class="active" href="/static/admin-learning.html">ఆమోదాలు</a><a href="/static/admin-audit.html">చర్యల జాడ</a></nav><section class="admin-card"><div id="list" class="admin-list"></div></section></div><script>const $=s=>document.querySelector(s);const api=async(u,o={})=>{const r=await fetch(u,{credentials:'same-origin',...o});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||'చిక్కు వచ్చింది');return d};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function review(id,ok){await api('/admin/learning/'+id+'/'+(ok?'approve':'reject'),{method:'POST'});load()}async function load(){try{const d=await api('/admin/learning/pending');const a=d.candidates||[];$('#list').innerHTML=a.map(c=>`<article class="admin-row"><div class="admin-row-head"><div><b>#${esc(c.id)}</b> <span class="badge">${esc(c.knowledge_type)}</span></div><div class="admin-actions"><button class="primary" onclick="review(${c.id},true)">ఆమోదించు</button><button class="secondary danger" onclick="review(${c.id},false)">తిరస్కరించు</button></div></div><pre style="white-space:pre-wrap;color:#cbd1dc;line-height:1.5;overflow:auto">${esc(JSON.stringify(c.payload,null,2))}</pre></article>`).join('')||'<div class="empty">ఆమోదం కోసం ఏదీ లేదు.</div>'}catch(e){$('#list').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}async function boot(){try{const me=await api('/auth/me');if(!['owner','admin'].includes(me.role))throw Error('నిర్వాహక హక్కు కావాలి.');load()}catch(e){$('#list').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}boot();</script></body></html>
