<!doctype html><html lang="te"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TeluAI — ఆమోదాలు</title><link rel="stylesheet" href="/static/css/professional.css"><link rel="stylesheet" href="/static/css/admin.css"><style>body{background:transparent;overflow:auto}.admin-shell{padding:22px;max-width:1280px;margin:auto}.admin-shell>.admin-top,.admin-shell>.admin-nav{display:none}</style></head><body><div class="admin-shell"><section class="admin-card"><div class="admin-section-head"><div><h1 class="admin-title">ఆమోదాలు</h1><p class="admin-muted">వాడుకరులు సమర్పించిన మేలిమి భాషా తెలిమిని పరిశీలించి, ఆమోదించి లేదా తిరస్కరించండి.</p></div><button class="secondary" id="refresh">తాజాగా చూడు</button></div><div class="admin-notice">ఆమోదించే ముందు పదం, అర్థం, వ్యాకరణం మరియు metadata సరైనవో పరిశీలించండి. ఆమోదిత తెలిమి భాషా నిలయంలోకి వెళ్తుంది.</div><div id="list" class="admin-list"></div></section></div><script>const $=s=>document.querySelector(s);const api=async(u,o={})=>{const r=await fetch(u,{credentials:'same-origin',...o});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||'చిక్కు వచ్చింది');return d};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function review(id,ok){if(!confirm(ok?'ఈ తెలిమిని ఆమోదించాలా?':'ఈ సమర్పణను తిరస్కరించాలా?'))return;await api('/admin/learning/'+id+'/'+(ok?'approve':'reject'),{method:'POST'});load()}async function load(){try{const d=await api('/admin/learning/pending');const a=d.candidates||[];$('#list').innerHTML=a.map(c=>`<article class="admin-row"><div class="admin-row-head"><div><span class="badge warn">#${esc(c.id)}</span> <span class="badge">${esc(c.knowledge_type)}</span><div class="admin-muted" style="margin-top:7px">ఆమోదం కోసం వచ్చిన తెలిమి</div></div><div class="admin-actions"><button class="primary" onclick="review(${c.id},true)">ఆమోదించు</button><button class="secondary danger" onclick="review(${c.id},false)">తిరస్కరించు</button></div></div><pre class="admin-code">${esc(JSON.stringify(c.payload,null,2))}</pre></article>`).join('')||'<div class="empty"><strong>ఆమోదాలు లేవు</strong>ప్రస్తుతం పరిశీలించాల్సిన సమర్పణ ఏదీ లేదు.</div>'}catch(e){$('#list').innerHTML=`<div class="admin-error">${esc(e.message)}</div>`}}$('#refresh').onclick=load;api('/auth/me').then(x=>{if(!['owner','admin'].includes(x.role))throw Error('నిర్వాహక హక్కు కావాలి.');load()}).catch(e=>$('#list').innerHTML=`<div class="admin-error">${esc(e.message)}</div>`);</script></body></html>
