<!doctype html><html lang="te"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TeluAI — వాడుకరులు</title><link rel="stylesheet" href="/static/css/professional.css"><link rel="stylesheet" href="/static/css/admin.css"><style>body{background:transparent;overflow:auto}.admin-shell{padding:22px;max-width:1280px;margin:auto}.admin-shell>.admin-top,.admin-shell>.admin-nav{display:none}</style></head><body><div class="admin-shell"><section class="admin-card"><div class="admin-section-head"><div><h1 class="admin-title">వాడుకరులు</h1><p class="admin-muted">ఖాతాలు, పాత్రలు మరియు ప్రవేశ స్థితిని నిర్వహించండి.</p></div></div><div class="admin-grid" id="stats"></div><div class="admin-toolbar"><input id="q" placeholder="వాడుకరి లేదా emailలో వెతుకు…"><select id="roleFilter"><option value="">అన్ని పాత్రలు</option><option value="owner">owner</option><option value="admin">admin</option><option value="user">user</option></select><select id="statusFilter"><option value="">అన్ని స్థితులు</option><option value="active">చురుకు</option><option value="disabled">నిలిపివేత</option></select><button class="secondary" id="refresh">తాజాగా చూడు</button></div><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>వాడుకరి</th><th>Email</th><th>పాత్ర</th><th>స్థితి</th><th>నిర్వహణ</th></tr></thead><tbody id="users"></tbody></table></div></section></div><script>const $=s=>document.querySelector(s);const api=async(u,o={})=>{const r=await fetch(u,{credentials:'same-origin',...o});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||'చిక్కు వచ్చింది');return d};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));let me=null,all=[];function filtered(){const q=$('#q').value.trim().toLowerCase(),role=$('#roleFilter').value,status=$('#statusFilter').value;return all.filter(u=>(!q||`${u.username} ${u.email}`.toLowerCase().includes(q))&&(!role||u.role===role)&&(!status||(status==='active'?u.is_active:!u.is_active)))}function render(){const rows=filtered();$('#users').innerHTML=rows.map(u=>{const can=me.role==='owner'&&u.role!=='owner'&&u.id!==me.id;return `<tr><td><b>${esc(u.username)}</b></td><td>${esc(u.email)}</td><td><span class="badge">${esc(u.role)}</span></td><td><span class="admin-status ${u.is_active?'active':'disabled'}">${u.is_active?'చురుకు':'నిలిపివేత'}</span></td><td>${can?`<div class="admin-inline"><select id="r${u.id}"><option value="user" ${u.role==='user'?'selected':''}>user</option><option value="admin" ${u.role==='admin'?'selected':''}>admin</option></select><button class="secondary" onclick="role(${u.id})">పాత్ర మార్చు</button><button class="secondary" onclick="active(${u.id},${!u.is_active})">${u.is_active?'నిలిపివేయి':'చురుకు చేయి'}</button><button class="secondary danger" onclick="del(${u.id})">తొలగించు</button></div>`:'<span class="admin-muted">కాపాడబడింది</span>'}</td></tr>`}).join('')||'<tr><td colspan="5"><div class="empty"><strong>వాడుకరులు లేరు</strong></div></td></tr>'}async function load(){try{const d=await api('/admin/database/users');all=d.users||[];render()}catch(e){$('#users').innerHTML=`<tr><td colspan="5"><div class="admin-error">${esc(e.message)}</div></td></tr>`}}async function role(id){await api(`/admin/users/${id}/role?role=${encodeURIComponent($('#r'+id).value)}`,{method:'POST'});await load()}async function active(id,v){await api(`/admin/users/${id}/active?active=${v}`,{method:'POST'});await Promise.all([load(),stats()])}async function del(id){if(!confirm('ఈ వాడుకరిని మరియు వారి యాజమాన్య డేటాను తొలగించాలా?'))return;await api('/admin/users/'+id,{method:'DELETE'});await Promise.all([load(),stats()])}async function stats(){const d=await api('/admin/database/stats');const labels={users:'మొత్తం వాడుకరులు',active_users:'చురుకు వాడుకరులు',admins:'నిర్వాహకులు',pending_learning:'ఆమోదాలు'};$('#stats').innerHTML=Object.entries(d.stats||{}).slice(0,4).map(([k,v])=>`<div class="admin-stat"><span>${esc(labels[k]||k.replaceAll('_',' '))}</span><b>${esc(v)}</b></div>`).join('')}api('/auth/me').then(x=>{me=x;if(!['owner','admin'].includes(me.role))throw Error('నిర్వాహక హక్కు కావాలి.');return Promise.all([load(),stats()])}).catch(e=>document.querySelector('.admin-shell').innerHTML=`<div class="admin-card"><div class="admin-error">${esc(e.message)}</div></div>`);$('#q').oninput=render;$('#roleFilter').onchange=render;$('#statusFilter').onchange=render;$('#refresh').onclick=()=>Promise.all([load(),stats()]);</script></body></html>
