<!doctype html><html lang="te"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TeluAI — వాడుకరులు</title><link rel="stylesheet" href="/static/css/professional.css"><link rel="stylesheet" href="/static/css/admin.css"></head><body><div class="admin-shell"><header class="admin-top"><div><h1 class="admin-title">వాడుకరులు</h1><div class="admin-muted">ఖాతాలు, పాత్రలు మరియు ప్రవేశ నియంత్రణ.</div></div><button class="pill-btn" onclick="location.href='/'">AIకి వెనుకకు</button></header><nav class="admin-nav"><a href="/static/admin.html">సారాంశం</a><a href="/static/admin-language.html">భాషా నిలయం</a><a class="active" href="/static/admin-users.html">వాడుకరులు</a><a href="/static/admin-learning.html">ఆమోదాలు</a><a href="/static/admin-audit.html">చర్యల జాడ</a></nav><section class="admin-card"><div class="admin-grid" id="stats"></div><div class="admin-list" style="overflow:auto"><table class="admin-table"><thead><tr><th>వాడుకరి</th><th>Email</th><th>పాత్ర</th><th>స్థితి</th><th>చర్యలు</th></tr></thead><tbody id="users"></tbody></table></div></section></div><script>const $=s=>document.querySelector(s);const api=async(u,o={})=>{const r=await fetch(u,{credentials:'same-origin',...o});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||'చిక్కు వచ్చింది');return d};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));let me=null;async function load(){const d=await api('/admin/database/users');$('#users').innerHTML=d.users.map(u=>{const can=me.role==='owner'&&u.role!=='owner'&&u.id!==me.id;return `<tr><td><b>${esc(u.username)}</b></td><td>${esc(u.email)}</td><td><span class="badge">${esc(u.role)}</span></td><td>${u.is_active?'ჩురుకు':'నిలిపివేత'}</td><td>${can?`<select id="r${u.id}"><option value="user">user</option><option value="admin">admin</option></select> <button class="secondary" onclick="role(${u.id})">పాత్ర</button> <button class="secondary" onclick="active(${u.id},${!u.is_active})">${u.is_active?'నిలిపివేయి':'చురుకు చేయి'}</button> <button class="secondary danger" onclick="del(${u.id})">తొలగించు</button>`:'కాపాడబడింది'}</td></tr>`}).join('')}async function role(id){await api(`/admin/users/${id}/role?role=${encodeURIComponent($('#r'+id).value)}`,{method:'POST'});load()}async function active(id,v){await api(`/admin/users/${id}/active?active=${v}`,{method:'POST'});load();stats()}async function del(id){if(!confirm('ఈ వాడుకరిని తొలగించాలా?'))return;await api('/admin/users/'+id,{method:'DELETE'});load();stats()}async function stats(){const d=await api('/admin/database/stats');$('#stats').innerHTML=Object.entries(d.stats).map(([k,v])=>`<div class="admin-stat"><div class="admin-muted">${esc(k.replaceAll('_',' '))}</div><b>${esc(v)}</b></div>`).join('')}async function boot(){try{me=await api('/auth/me');if(!['owner','admin'].includes(me.role))throw Error('నిర్వాహక హక్కు కావాలి.');await Promise.all([load(),stats()])}catch(e){document.body.innerHTML='<div class="admin-shell"><div class="admin-card empty">'+esc(e.message)+'</div></div>'}}boot();</script></body></html>
