<!doctype html><html lang="te"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TeluAI — మేలిమి భాషా నిలయం</title><link rel="stylesheet" href="/static/css/professional.css"><link rel="stylesheet" href="/static/css/admin.css"></head><body><div class="admin-shell"><header class="admin-top"><div class="admin-brand"><div class="logo">T</div><div><b>TeluAI</b><div class="admin-muted">మేలిమి తెలుగు భాషా నిలయం</div></div></div><button class="pill-btn" onclick="location.href='/'">AIకి వెనుకకు</button></header><nav class="admin-nav"><a href="/static/admin.html">సారాంశం</a><a class="active" href="/static/admin-language.html">భాషా నిలయం</a><a href="/static/admin-users.html">వాడుకరులు</a><a href="/static/admin-learning.html">ఆమోదాలు</a><a href="/static/admin-audit.html">చర్యల జాడ</a></nav><section class="admin-card"><h1 class="admin-title">మేలిమి తెలుగు భాషా నిలయం</h1><p class="admin-muted">నుడి, పలుకులు, కతనాలు, వ్యాకరణం, నియమాలు, ఉదాహరణలు మరియు ఇతర భాషా తెలిమికి కేంద్రీకృత స్థలం. Owner మరియు approved admins మాత్రమే మార్చగలరు.</p><div class="admin-toolbar"><input id="q" placeholder="మేలిమి తెలిమిలో వెతుకు…"><select id="kind"><option value="">అన్నీ</option><option>DICTIONARY</option><option>POST</option><option>GRAMMAR</option><option>RULE</option><option>EXAMPLE</option><option>FACT</option><option>NOTE</option><option>DOCUMENT</option></select><button class="secondary" id="refresh">తాజాగా చూడు</button></div><div id="list" class="admin-list"></div></section></div><div id="modal" class="admin-modal hidden"><div class="admin-modal-card"><div class="admin-modal-head"><h2 id="modalTitle">చేర్పు</h2><button class="close" id="close">×</button></div><div class="admin-field"><label>రకం</label><select id="ekind"><option>DICTIONARY</option><option>POST</option><option>GRAMMAR</option><option>RULE</option><option>EXAMPLE</option><option>FACT</option><option>NOTE</option><option>DOCUMENT</option></select></div><div class="admin-field"><label>పేరు / పదం / key</label><input id="ekey"></div><div class="admin-field"><label>తెలిమి / content</label><textarea id="evalue" rows="10"></textarea></div><div class="admin-field"><label>Metadata JSON</label><textarea id="emeta" rows="4" placeholder='{"category":"vocabulary"}'></textarea></div><p id="err" class="admin-muted"></p><div class="admin-actions-end"><button class="secondary" id="cancel">వదులు</button><button class="primary" id="save">దాచు</button></div></div></div><script>const $=s=>document.querySelector(s);const api=async(u,o={})=>{const r=await fetch(u,{credentials:'same-origin',...o});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||'చిక్కు వచ్చింది');return d};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));let editing=null;function open(r=null){editing=r?.id||null;$('#modalTitle').textContent=r?'చేర్పు మార్చు':'కొత్త చేర్పు';$('#ekind').value=r?.kind||'DICTIONARY';$('#ekey').value=r?.key||'';$('#evalue').value=r?.value||'';$('#emeta').value=r?JSON.stringify(r.metadata||{},null,2):'';$('#err').textContent='';$('#modal').classList.remove('hidden')}function close(){ $('#modal').classList.add('hidden')}async function load(){try{const p=new URLSearchParams({limit:300,q:$('#q').value.trim()});if($('#kind').value)p.set('kind',$('#kind').value);const d=await api('/admin/language-space?'+p);$('#list').innerHTML=(d.entries||[]).map(r=>`<article class="admin-row"><div class="admin-row-head"><div><span class="badge">${esc(r.kind)}</span><div class="admin-muted">v${esc(r.version)} · ${esc(r.status)}</div></div><div class="admin-actions"><button class="secondary" onclick='edit(${JSON.stringify(r)})'>చేర్పు మార్చు</button><button class="secondary danger" onclick='removeEntry(${r.id})'>తొలగించు</button></div></div><div style="margin-top:9px"><b>${esc(r.key)}</b><div class="admin-muted" style="white-space:pre-wrap;margin-top:5px">${esc(r.value)}</div></div></article>`).join('')||'<div class="empty">ఈ భాషా నిలయంలో చేర్పులు లేవు.</div>'}catch(e){$('#list').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}function edit(r){open(r)}async function removeEntry(id){if(!confirm('ఈ భాషా చేర్పును తొలగించాలా?'))return;await api('/admin/language-space/'+id,{method:'DELETE'});load()}async function save(){let metadata={};try{metadata=$('#emeta').value.trim()?JSON.parse($('#emeta').value):{}}catch(e){$('#err').textContent='Metadata JSON సరిగా లేదు.';return}try{await api(editing?'/admin/language-space/'+editing:'/admin/language-space',{method:editing?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind:$('#ekind').value,key:$('#ekey').value,value:$('#evalue').value,metadata})});close();load()}catch(e){$('#err').textContent=e.message}}$('#close').onclick=close;$('#cancel').onclick=close;$('#save').onclick=save;$('#refresh').onclick=load;$('#kind').onchange=load;let t;$('#q').oninput=()=>{clearTimeout(t);t=setTimeout(load,250)};async function boot(){try{const me=await api('/auth/me');if(!['owner','admin'].includes(me.role))throw Error('నిర్వాహక హక్కు కావాలి.');load()}catch(e){$('#list').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}boot();</script></body></html>
