<!doctype html><html lang="te"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TeluAI — మేలిమి భాషా నిలయం</title><link rel="stylesheet" href="/static/css/professional.css"><link rel="stylesheet" href="/static/css/admin.css"><style>
body{background:transparent;overflow:auto}.admin-shell{padding:22px;max-width:1280px;margin:auto}.admin-shell>.admin-top,.admin-shell>.admin-nav{display:none}.space-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:18px}.space-head h1{margin:0 0 5px}.space-head p{margin:0}.space-add{display:flex;align-items:center;gap:8px;white-space:nowrap}.type-strip{display:flex;gap:8px;overflow:auto;padding-bottom:3px;margin-bottom:14px;scrollbar-width:none}.type-strip::-webkit-scrollbar{display:none}.type-chip{flex:0 0 auto;border:1px solid var(--line);background:#11141b;color:#aeb5c4;border-radius:11px;padding:9px 13px;cursor:pointer}.type-chip.active{background:#211e39;color:#fff;border-color:#514a86}.content-toolbar{display:flex;gap:9px;align-items:center;margin-bottom:14px}.content-toolbar input{flex:1;min-width:120px}.content-count{font-size:12px;color:var(--muted);white-space:nowrap}.content-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.content-card{border:1px solid var(--line);background:#11141b;border-radius:15px;padding:16px;min-width:0}.content-card:hover{border-color:#3a4050}.content-card-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.content-kind{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#aeb5c4}.content-title{font-size:16px;font-weight:700;margin:9px 0 7px;word-break:break-word}.content-body{color:#bfc5d0;font-size:13px;line-height:1.6;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}.content-foot{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:14px;padding-top:11px;border-top:1px solid var(--line)}.content-actions{display:flex;gap:6px}.empty-content{grid-column:1/-1;text-align:center;border:1px dashed var(--line);border-radius:15px;padding:42px 20px;color:var(--muted)}.empty-content b{display:block;color:#d9dee7;margin-bottom:5px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field-full{grid-column:1/-1}.generator-note{font-size:12px;color:var(--muted);line-height:1.5;margin:-2px 0 12px}.generator-kind{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}.generator-kind button{border:1px solid var(--line);background:#11141b;color:#aeb5c4;border-radius:10px;padding:8px 11px}.generator-kind button.active{background:#211e39;color:#fff;border-color:#514a86}.hidden{display:none!important}@media(max-width:760px){.space-head{align-items:stretch;flex-direction:column}.space-add{width:100%}.space-add button{width:100%}.content-grid{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.field-full{grid-column:auto}.content-toolbar{align-items:stretch;flex-direction:column}.content-count{align-self:flex-start}}
</style></head><body><div class="admin-shell"><section class="admin-card">
<header class="space-head"><div><h1 class="admin-title">మేలిమి తెలుగు భాషా నిలయం</h1><p class="admin-muted">నుడి, పలుకులు, కతనాలు, వ్యాకరణం, నియమాలు, ఉదాహరణలు మరియు ఇతర భాషా తెలిమి.</p></div><div class="space-add"><button class="primary" id="newEntry">＋ కొత్తగా చేర్చు</button></div></header>
<div class="type-strip" id="typeStrip"><button class="type-chip active" data-kind="">అన్నీ</button><button class="type-chip" data-kind="DICTIONARY">నిఘంటువు</button><button class="type-chip" data-kind="POST">కతనాలు</button><button class="type-chip" data-kind="GRAMMAR">వ్యాకరణం</button><button class="type-chip" data-kind="RULE">నియమాలు</button><button class="type-chip" data-kind="EXAMPLE">ఉదాహరణలు</button><button class="type-chip" data-kind="FACT">తెలిమి</button><button class="type-chip" data-kind="NOTE">గమనికలు</button><button class="type-chip" data-kind="DOCUMENT">పత్రాలు</button></div>
<div class="content-toolbar"><input id="q" placeholder="పదం, పేరు లేదా తెలిమిలో వెతుకు…"><span class="content-count" id="count"></span><button class="secondary" id="refresh">తాజాగా చూడు</button></div><div id="list" class="content-grid"></div>
</section></div>
<div id="modal" class="admin-modal hidden"><div class="admin-modal-card" style="max-width:720px"><div class="admin-modal-head"><div><h2 id="modalTitle">కొత్తగా చేర్చు</h2><div class="admin-muted">చేర్చాల్సిన భాషా అంశానికి తగిన రూపాన్ని ఎంచుకోండి.</div></div><button class="close" id="close">×</button></div>
<div class="generator-kind" id="generatorKind"><button data-kind="DICTIONARY" class="active">నిఘంటువు</button><button data-kind="POST">కతనం</button><button data-kind="GRAMMAR">వ్యాకరణం</button><button data-kind="RULE">నియమం</button><button data-kind="EXAMPLE">ఉదాహరణ</button><button data-kind="FACT">తెలిమి</button><button data-kind="NOTE">గమనిక</button><button data-kind="DOCUMENT">పత్రం</button></div>
<div id="generator"></div><p id="err" class="admin-error" style="display:none"></p><div class="admin-actions-end"><button class="secondary" id="cancel">వదులు</button><button class="primary" id="save">దాచు</button></div></div></div>
<script>
const $=s=>document.querySelector(s);const api=async(u,o={})=>{const r=await fetch(u,{credentials:'same-origin',...o});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||'చిక్కు వచ్చింది');return d};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));let editing=null,currentKind='DICTIONARY',currentFilter='';
const labels={DICTIONARY:'నిఘంటువు',POST:'కతనం',GRAMMAR:'వ్యాకరణం',RULE:'నియమం',EXAMPLE:'ఉదాహరణ',FACT:'తెలిమి',NOTE:'గమనిక',DOCUMENT:'పత్రం'};
const forms={DICTIONARY:{note:'ఒక పదానికి మేలిమి సమానపదం, అర్థం మరియు వాడుకను నమోదు చేయండి.',fields:[['key','ప్రామాణిక పదం','input','ఉదా: mobile'],['value','మేలిమి పలుకు','input','ఉదా: చేవీనం'],['meaning','అర్థం / సమానార్థాలు','input','ఉదా: cellphone, mobile, hand phone'],['category','వర్గం','input','ఉదా: సాంకేతికత'],['example','వాడుక ఉదాహరణ','textarea','ఉదా: చేవీనంతో చిత్రాలు తీయవచ్చు.']]},POST:{note:'మేలిమి భాషకు సంబంధించిన స్వతంత్ర కతనం లేదా వ్యాసాన్ని నమోదు చేయండి.',fields:[['key','కతనం పేరు','input','శీర్షిక'],['value','కతనం','textarea','పూర్తి కతనం…'],['category','వర్గం','input','ఉదా: భాష / చరిత్ర / పదనిర్మాణం']]},GRAMMAR:{note:'వ్యాకరణ భావం, వివరణ, నియమం మరియు ఉదాహరణలను ఒకచోట ఉంచండి.',fields:[['key','వ్యాకరణ అంశం','input','ఉదా: -కాను'],['value','వివరణ','textarea','వ్యాకరణ వివరణ…'],['example','ఉదాహరణలు','textarea','ఉదాహరణలు…'],['category','వర్గం','input','ఉదా: పదనిర్మాణం']]},RULE:{note:'పదనిర్మాణం లేదా భాషా వాడుకకు సంబంధించిన నియమాన్ని నమోదు చేయండి.',fields:[['key','నియమం పేరు','input','ఉదా: -ఈవి / -ఈవు'],['value','నియమం','textarea','నియమ వివరణ…'],['example','ఉదాహరణలు','textarea','ఉదాహరణలు…']]},EXAMPLE:{note:'ఒక పదం, నియమం లేదా వ్యాకరణ భావానికి నిజమైన వాడుక ఉదాహరణ.',fields:[['key','ఏ అంశానికి?','input','పదం లేదా నియమం'],['value','ఉదాహరణ','textarea','వాక్యం / ఉదాహరణ…'],['category','వర్గం','input','ఉదా: వాడుక']]},FACT:{note:'మేలిమి భాషకు ఉపయోగపడే వాస్తవం లేదా స్థిరమైన తెలిమి.',fields:[['key','తెలిమి పేరు','input','శీర్షిక'],['value','తెలిమి','textarea','వివరాలు…'],['category','వర్గం','input','వర్గం']]},NOTE:{note:'చిన్న భాషా గమనిక, పరిశీలన లేదా సంపాదక సూచన.',fields:[['key','గమనిక పేరు','input','శీర్షిక'],['value','గమనిక','textarea','గమనిక…']]},DOCUMENT:{note:'పెద్ద భాషా పత్రం లేదా సంచిత సమాచారం.',fields:[['key','పత్రం పేరు','input','శీర్షిక'],['value','పత్రం','textarea','పూర్తి పత్రం…'],['category','వర్గం','input','ఉదా: corpus']]}};
function renderGenerator(kind,current={}){currentKind=kind;const f=forms[kind];$('#generator').innerHTML=`<p class="generator-note">${f.note}</p><div class="form-grid">${f.fields.map(([id,label,type,ph])=>`<div class="admin-field ${id==='value'||id==='example'?'field-full':''}"><label>${label}</label>${type==='textarea'?`<textarea id="f_${id}" rows="${id==='value'?8:4}" placeholder="${ph}">${esc(current[id]||'')}</textarea>`:`<input id="f_${id}" value="${esc(current[id]||'')}" placeholder="${ph}">`}</div>`).join('')}</div>`;document.querySelectorAll('#generatorKind button').forEach(b=>b.classList.toggle('active',b.dataset.kind===kind))}
function openEditor(row=null){editing=row?.id||null;$('#modalTitle').textContent=row?'చేర్పు మార్చు':'కొత్తగా చేర్చు';currentKind=row?.kind||'DICTIONARY';renderGenerator(currentKind,row?{key:row.key,value:row.value,...(row.metadata||{})}:{});$('#err').style.display='none';$('#modal').classList.remove('hidden')}
function close(){ $('#modal').classList.add('hidden')}
function formPayload(){const f=forms[currentKind];const data={};f.fields.forEach(([id])=>data[id]=$('#f_'+id)?.value.trim()||'');const metadata={};if(currentKind==='DICTIONARY'){metadata.meaning=data.meaning||'';metadata.category=data.category||'';metadata.example=data.example||''}else{if(data.category)metadata.category=data.category;if(data.example)metadata.example=data.example}return {kind:currentKind,key:data.key,value:data.value,metadata}}
async function save(){const body=formPayload();if(!body.key||!body.value){$('#err').textContent='పేరు/పదం మరియు ప్రధాన తెలిమి తప్పనిసరి.';$('#err').style.display='block';return}try{await api(editing?'/admin/language-space/'+editing:'/admin/language-space',{method:editing?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});close();load()}catch(e){$('#err').textContent=e.message;$('#err').style.display='block'}}
async function load(){try{const p=new URLSearchParams({limit:300,q:$('#q').value.trim()});if(currentFilter)p.set('kind',currentFilter);const d=await api('/admin/language-space?'+p);const rows=d.entries||[];$('#count').textContent=`${rows.length} చేర్పులు`;$('#list').innerHTML=rows.map(r=>`<article class="content-card"><div class="content-card-top"><span class="content-kind">${esc(labels[r.kind]||r.kind)}</span><span class="badge">${esc(r.status)}</span></div><div class="content-title">${esc(r.key)}</div><div class="content-body">${esc(r.value)}</div><div class="content-foot"><span class="admin-muted">వెర్షన్ ${esc(r.version)}</span><div class="content-actions"><button class="secondary" onclick='edit(${JSON.stringify(r)})'>మార్చు</button><button class="secondary danger" onclick='removeEntry(${r.id})'>తొలగించు</button></div></div></article>`).join('')||'<div class="empty-content"><b>ఇంకా భాషా తెలిమి లేదు</b><span>పై “＋ కొత్తగా చేర్చు” ద్వారా మొదటి చేర్పును జోడించండి.</span></div>'}catch(e){$('#list').innerHTML=`<div class="admin-error" style="grid-column:1/-1">${esc(e.message)}</div>`}}
function edit(r){openEditor(r)}async function removeEntry(id){if(!confirm('ఈ భాషా చేర్పును తొలగించాలా?'))return;try{await api('/admin/language-space/'+id,{method:'DELETE'});load()}catch(e){alert(e.message)}}
$('#newEntry').onclick=()=>openEditor();$('#close').onclick=close;$('#cancel').onclick=close;$('#save').onclick=save;$('#refresh').onclick=load;document.querySelectorAll('#typeStrip .type-chip').forEach(b=>b.onclick=()=>{currentFilter=b.dataset.kind;document.querySelectorAll('#typeStrip .type-chip').forEach(x=>x.classList.toggle('active',x===b));load()});document.querySelectorAll('#generatorKind button').forEach(b=>b.onclick=()=>renderGenerator(b.dataset.kind));let t;$('#q').oninput=()=>{clearTimeout(t);t=setTimeout(load,250)};api('/auth/me').then(x=>{if(!['owner','admin'].includes(x.role))throw Error('నిర్వాహక హక్కు కావాలి.');load()}).catch(e=>$('#list').innerHTML=`<div class="admin-error" style="grid-column:1/-1">${esc(e.message)}</div>`);
</script></body></html>
